<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <!-- Outer Card Container -->
  <rect x="15" y="15" width="930" height="890" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Header Title Banner -->
  <rect x="15" y="15" width="930" height="60" rx="16" fill="#0f172a" />
  <rect x="15" y="55" width="930" height="20" fill="#0f172a" />
  <text x="480" y="52" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    HÌNH 2.2: MÔ HÌNH TRIỂN KHAI HỆ THỐNG AUTOCARE OFFICE HELPER (ACOH)
  </text>

  <!-- ================= 1. CLIENT TIER ================= -->
  <g transform="translate(60, 95)">
    <!-- Container Box -->
    <rect x="0" y="0" width="840" height="125" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" />
    <rect x="0" y="0" width="840" height="32" rx="10" fill="#0284c7" />
    <rect x="0" y="22" width="840" height="10" fill="#0284c7" />
    <text x="20" y="22" fill="#ffffff" font-size="14.5" font-weight="bold">1. TẦNG THIẾT BỊ NGƯỜI DÙNG (CLIENT TIER / USER INTERFACE)</text>
    <text x="820" y="22" fill="#e0f2fe" font-size="12.5" font-weight="500" text-anchor="end">Chủ xe (User) | Quản trị Gara (Garage) | Admin</text>
    
    <!-- Client items -->
    <rect x="15" y="44" width="255" height="66" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="142" y="68" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">Trình duyệt Máy tính (Desktop)</text>
    <text x="142" y="88" fill="#64748b" font-size="11.5" text-anchor="middle">Chrome, Edge, Firefox, Safari</text>
    <text x="142" y="102" fill="#0284c7" font-size="10.5" font-weight="600" text-anchor="middle">(Bảng điều khiển &amp; Quản trị xưởng)</text>

    <rect x="285" y="44" width="265" height="66" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="417" y="68" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">Trình duyệt Di động (Mobile)</text>
    <text x="417" y="88" fill="#64748b" font-size="11.5" text-anchor="middle">Smartphone Android / iOS</text>
    <text x="417" y="102" fill="#0284c7" font-size="10.5" font-weight="600" text-anchor="middle">(Giao diện Mobile-First, Dark Mode)</text>

    <rect x="565" y="44" width="260" height="66" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="695" y="68" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">Thiết bị Ngoại vi (Hardware)</text>
    <text x="695" y="88" fill="#64748b" font-size="11.5" text-anchor="middle">WebCam Laptop / Camera Điện thoại</text>
    <text x="695" y="102" fill="#0284c7" font-size="10.5" font-weight="600" text-anchor="middle">(Chụp ảnh quét biển số xe OCR)</text>
  </g>

  <!-- Connection Protocol (Client -> App Server) -->
  <g transform="translate(480, 220)">
    <!-- Dual Arrows -->
    <line x1="-120" y1="0" x2="-120" y2="45" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="-125,43 -115,43 -120,53" fill="#0284c7" />
    <polygon points="-125,10 -115,10 -120,0" fill="#0284c7" />
    
    <line x1="120" y1="0" x2="120" y2="45" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="115,43 125,43 120,53" fill="#16a34a" />
    <polygon points="115,10 125,10 120,0" fill="#16a34a" />

    <!-- Badges -->
    <rect x="-240" y="14" width="240" height="24" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="-120" y="30" fill="#0369a1" font-size="11" font-weight="bold" text-anchor="middle">HTTPS / RESTful API (JSON)</text>

    <rect x="0" y="14" width="240" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
    <text x="120" y="30" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">WSS / WebSockets (Socket.IO)</text>
  </g>

  <!-- ================= 2. APPLICATION SERVER TIER ================= -->
  <g transform="translate(60, 275)">
    <!-- Big Outer Container -->
    <rect x="0" y="0" width="840" height="330" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2.5" />
    <rect x="0" y="0" width="840" height="34" rx="10" fill="#334155" />
    <rect x="0" y="24" width="840" height="10" fill="#334155" />
    <text x="20" y="24" fill="#ffffff" font-size="14.5" font-weight="bold">2. TẦNG MÁY CHỦ ỨNG DỤNG (APPLICATION SERVER TIER / DOCKER CONTAINERS)</text>
    <text x="820" y="24" fill="#cbd5e1" font-size="12.5" font-weight="500" text-anchor="end">Node.js Runtime Environment</text>

    <!-- Sub-Box 1: Frontend Server -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="385" height="185" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <rect x="0" y="0" width="385" height="30" rx="8" fill="#0284c7" />
      <rect x="0" y="20" width="385" height="10" fill="#0284c7" />
      <text x="15" y="20" fill="#ffffff" font-size="13" font-weight="bold">Frontend Web Server (ReactJS + Vite)</text>
      
      <text x="15" y="52" fill="#334155" font-size="11.5" font-weight="bold">• Single Page Application (SPA Engine)</text>
      <text x="15" y="72" fill="#64748b" font-size="11">• TailwindCSS + Shadcn/ui Design System</text>
      <text x="15" y="92" fill="#64748b" font-size="11">• Bottom Navigation (Mobile-First Layout)</text>
      <text x="15" y="112" fill="#64748b" font-size="11">• Dark Mode / Light Mode Theme State</text>
      <text x="15" y="132" fill="#64748b" font-size="11">• Socket.IO Client (Real-time Toast Popup)</text>
      <text x="15" y="152" fill="#64748b" font-size="11">• Recharts (Biểu đồ thống kê chi tiêu/doanh thu)</text>
      <text x="15" y="172" fill="#0369a1" font-size="11" font-weight="bold">• Cổng dịch vụ: http://localhost:5173 (Port 5173)</text>
    </g>

    <!-- Sub-Box 2: Backend Server -->
    <g transform="translate(435, 50)">
      <rect x="0" y="0" width="385" height="185" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
      <rect x="0" y="0" width="385" height="30" rx="8" fill="#16a34a" />
      <rect x="0" y="20" width="385" height="10" fill="#16a34a" />
      <text x="15" y="20" fill="#ffffff" font-size="13" font-weight="bold">Backend API Server (NestJS Application)</text>
      
      <text x="15" y="52" fill="#334155" font-size="11.5" font-weight="bold">• RESTful API Controllers &amp; DTO Validation</text>
      <text x="15" y="72" fill="#64748b" font-size="11">• JWT Authentication &amp; RBAC Roles Guard</text>
      <text x="15" y="92" fill="#64748b" font-size="11">• Notifications Gateway (Socket.IO Server)</text>
      <text x="15" y="112" fill="#64748b" font-size="11">• Cron Job Engine (@Cron 00:00 Quét ngầm)</text>
      <text x="15" y="132" fill="#64748b" font-size="11">• Tesseract.js AI OCR Engine (Quét biển số)</text>
      <text x="15" y="152" fill="#64748b" font-size="11">• Luồng quy trình bảo dưỡng ô tô 4 bước</text>
      <text x="15" y="172" fill="#15803d" font-size="11" font-weight="bold">• Cổng dịch vụ: http://localhost:3000 (Port 3000)</text>
    </g>

    <!-- Sub-Box 3: External Services Integrations -->
    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="800" height="70" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
      <text x="15" y="22" fill="#7e22ce" font-size="12" font-weight="bold">TÍCH HỢP DỊCH VỤ NGOẠI VI (EXTERNAL SERVICES &amp; 3RD PARTY APIS):</text>
      
      <rect x="15" y="32" width="245" height="28" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
      <text x="137" y="51" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">📧 Nodemailer (Gmail SMTP Mailer)</text>

      <rect x="275" y="32" width="245" height="28" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
      <text x="397" y="51" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">💳 Cổng VNPAY / VietQR Sandbox</text>

      <rect x="535" y="32" width="250" height="28" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
      <text x="660" y="51" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">🤖 Google Gemini AI / LLM API</text>
    </g>
  </g>

  <!-- Connection Protocol (App Server -> Database) -->
  <g transform="translate(480, 605)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="5,5" />
    <polygon points="-6,43 6,43 0,53" fill="#9333ea" />
    <polygon points="-6,10 6,10 0,0" fill="#9333ea" />
    
    <rect x="-180" y="14" width="360" height="24" rx="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="1" />
    <text x="0" y="30" fill="#7e22ce" font-size="11.5" font-weight="bold" text-anchor="middle">
      TDS Protocol / Connection String (mssql driver, Port 1433)
    </text>
  </g>

  <!-- ================= 3. DATABASE TIER ================= -->
  <g transform="translate(60, 660)">
    <!-- Database Container -->
    <rect x="0" y="0" width="840" height="185" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" />
    <rect x="0" y="0" width="840" height="34" rx="10" fill="#dc2626" />
    <rect x="0" y="24" width="840" height="10" fill="#dc2626" />
    <text x="20" y="24" fill="#ffffff" font-size="14.5" font-weight="bold">3. TẦNG CƠ SỞ DỮ LIỆU (DATABASE SERVER TIER / MS SQL SERVER)</text>
    <text x="820" y="24" fill="#fee2e2" font-size="12.5" font-weight="500" text-anchor="end">Microsoft SQL Server 2014+ (Relational Database)</text>

    <!-- Table Groups -->
    <g transform="translate(15, 46)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="260" height="124" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="15" y="22" fill="#991b1b" font-size="12" font-weight="bold">Người dùng &amp; Phương tiện</text>
      <text x="15" y="44" fill="#475569" font-size="11">• [Users] (Tài khoản, Role, Theme)</text>
      <text x="15" y="64" fill="#475569" font-size="11">• [Vehicles] (Xe, Odometer, HTX)</text>
      <text x="15" y="84" fill="#475569" font-size="11">• [LegalDocuments] (Đăng kiểm, Bảo hiểm TNDS, Thân vỏ)</text>
      <text x="15" y="104" fill="#dc2626" font-size="10.5" font-style="italic">* Ràng buộc Khóa chính/Khóa ngoại</text>

      <!-- Box 2 -->
      <rect x="275" y="0" width="260" height="124" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="290" y="22" fill="#991b1b" font-size="12" font-weight="bold">Ma trận &amp; Lịch sử Bảo dưỡng</text>
      <text x="290" y="44" fill="#475569" font-size="11">• [MaintenanceCategories] (Gói mốc km)</text>
      <text x="290" y="64" fill="#475569" font-size="11">• [MaintenanceItems] (Hạng mục bảo dưỡng)</text>
      <text x="290" y="84" fill="#475569" font-size="11">• [MaintenanceSchedules] (Lịch nhắc km/ngày)</text>
      <text x="290" y="104" fill="#475569" font-size="11">• [MaintenanceHistory] (Sổ sửa chữa xe)</text>

      <!-- Box 3 -->
      <rect x="550" y="0" width="260" height="124" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <text x="565" y="22" fill="#991b1b" font-size="12" font-weight="bold">Gara, Đặt lịch &amp; Thông báo</text>
      <text x="565" y="44" fill="#475569" font-size="11">• [Garages] (Danh sách gara đối tác)</text>
      <text x="565" y="64" fill="#475569" font-size="11">• [Appointments] (Lịch hẹn 4 bước)</text>
      <text x="565" y="84" fill="#475569" font-size="11">• [Notifications] (Thông báo Real-time)</text>
      <text x="565" y="104" fill="#475569" font-size="11">• [Payments] (Thanh toán VNPAY/VietQR)</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="480" y="870" fill="#64748b" font-size="11.5" font-style="italic" text-anchor="middle">
    * Hệ thống triển khai theo mô hình 3 tầng phân tách độc lập (3-Tier Architecture) kết hợp WebSockets &amp; Database Transaction đảm bảo an toàn, bảo mật.
  </text>
</svg>
