<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 820" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <!-- Background border container -->
  <rect x="15" y="15" width="910" height="790" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Title Box -->
  <rect x="15" y="15" width="910" height="60" rx="16" fill="#0f172a" />
  <rect x="15" y="55" width="910" height="20" fill="#0f172a" />
  <text x="470" y="52" fill="#ffffff" font-size="18.5" font-weight="bold" text-anchor="middle" letter-spacing="0.3">
    HÌNH 2.1: KIẾN TRÚC CLEAN ARCHITECTURE HỆ THỐNG ACOH
  </text>

  <!-- 1. PRESENTATION LAYER -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="840" height="120" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" />
    <rect x="0" y="0" width="840" height="34" rx="10" fill="#0284c7" />
    <rect x="0" y="24" width="840" height="10" fill="#0284c7" />
    <text x="20" y="24" fill="#ffffff" font-size="15" font-weight="bold">1. PRESENTATION LAYER (TẦNG GIAO TIẾP &amp; ĐIỀU HƯỚNG)</text>
    <text x="820" y="24" fill="#e0f2fe" font-size="13" font-weight="500" text-anchor="end">NestJS Controllers, DTOs, WebSockets, Guards</text>
    
    <!-- Inner blocks -->
    <rect x="15" y="48" width="255" height="58" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="142" y="72" fill="#0369a1" font-size="13.5" font-weight="bold" text-anchor="middle">NestJS REST Controllers</text>
    <text x="142" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">Vehicles, Legal, Maintenance, Auth...</text>

    <rect x="285" y="48" width="265" height="58" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="417" y="72" fill="#0369a1" font-size="13.5" font-weight="bold" text-anchor="middle">DTOs &amp; Validation Pipes</text>
    <text x="417" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">Class-Validator, Request Payload Filters</text>

    <rect x="565" y="48" width="260" height="58" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="695" y="72" fill="#0369a1" font-size="13.5" font-weight="bold" text-anchor="middle">Realtime Gateway &amp; Guards</text>
    <text x="695" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">Socket.IO Gateway, AuthGuard, RolesGuard</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(470, 220)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,5" />
    <polygon points="-6,38 6,38 0,48" fill="#0284c7" />
    <rect x="-44" y="12" width="88" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="0" y="27" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">gọi (calls)</text>
  </g>

  <!-- 2. APPLICATION LAYER -->
  <g transform="translate(50, 275)">
    <rect x="0" y="0" width="840" height="120" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5" />
    <rect x="0" y="0" width="840" height="34" rx="10" fill="#16a34a" />
    <rect x="0" y="24" width="840" height="10" fill="#16a34a" />
    <text x="20" y="24" fill="#ffffff" font-size="15" font-weight="bold">2. APPLICATION LAYER (TẦNG ỨNG DỤNG &amp; USE CASES)</text>
    <text x="820" y="24" fill="#dcfce7" font-size="13" font-weight="500" text-anchor="end">Business Services &amp; Workflows</text>
    
    <!-- Inner blocks -->
    <rect x="15" y="48" width="255" height="58" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="142" y="72" fill="#15803d" font-size="13.5" font-weight="bold" text-anchor="middle">Core Business Services</text>
    <text x="142" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">VehicleService, LegalService, Booking...</text>

    <rect x="285" y="48" width="265" height="58" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="417" y="72" fill="#15803d" font-size="13.5" font-weight="bold" text-anchor="middle">Scheduled Cron Engine</text>
    <text x="417" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">CronService (Tự động quét ngầm lúc 00:00)</text>

    <rect x="565" y="48" width="260" height="58" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="695" y="72" fill="#15803d" font-size="13.5" font-weight="bold" text-anchor="middle">AI &amp; Smart Services</text>
    <text x="695" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">OCR Plate Recognition, AI Chatbot Helper</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(470, 395)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,5" />
    <polygon points="-6,38 6,38 0,48" fill="#16a34a" />
    <rect x="-44" y="12" width="88" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
    <text x="0" y="27" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">gọi (calls)</text>
  </g>

  <!-- 3. DOMAIN LAYER -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="840" height="120" rx="10" fill="#f8fafc" stroke="#d97706" stroke-width="2.5" />
    <rect x="0" y="0" width="840" height="34" rx="10" fill="#d97706" />
    <rect x="0" y="24" width="840" height="10" fill="#d97706" />
    <text x="20" y="24" fill="#ffffff" font-size="15" font-weight="bold">3. DOMAIN LAYER (TẦNG NGHIỆP VỤ CỐT LÕI - CORE DOMAIN)</text>
    <text x="820" y="24" fill="#fef3c7" font-size="13" font-weight="500" text-anchor="end">Pure Entities, Rules &amp; Repository Interfaces</text>
    
    <!-- Inner blocks -->
    <rect x="15" y="48" width="255" height="58" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
    <text x="142" y="72" fill="#b45309" font-size="13.5" font-weight="bold" text-anchor="middle">Pure Domain Entities</text>
    <text x="142" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">Vehicle, LegalDocument, Schedule...</text>

    <rect x="285" y="48" width="265" height="58" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
    <text x="417" y="72" fill="#b45309" font-size="13.5" font-weight="bold" text-anchor="middle">Domain Business Rules</text>
    <text x="417" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">DATEDIFF Đăng kiểm, Ngưỡng km &lt;= 500</text>

    <rect x="565" y="48" width="260" height="58" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
    <text x="695" y="72" fill="#b45309" font-size="13.5" font-weight="bold" text-anchor="middle">Repository Interfaces</text>
    <text x="695" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">IVehicleRepo, ILegalRepo, IScheduleRepo...</text>
  </g>

  <!-- Arrow 4 -> 3 (Dependency Inversion: Implements Interface) -->
  <g transform="translate(470, 570)">
    <line x1="0" y1="48" x2="0" y2="10" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="5,5" />
    <polygon points="-6,12 6,12 0,2" fill="#9333ea" />
    <rect x="-75" y="14" width="150" height="22" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1" />
    <text x="0" y="29" fill="#7e22ce" font-size="12" font-weight="bold" text-anchor="middle">triển khai (implements)</text>
  </g>

  <!-- 4. INFRASTRUCTURE LAYER -->
  <g transform="translate(50, 625)">
    <rect x="0" y="0" width="840" height="120" rx="10" fill="#f8fafc" stroke="#9333ea" stroke-width="2.5" />
    <rect x="0" y="0" width="840" height="34" rx="10" fill="#9333ea" />
    <rect x="0" y="24" width="840" height="10" fill="#9333ea" />
    <text x="20" y="24" fill="#ffffff" font-size="15" font-weight="bold">4. INFRASTRUCTURE LAYER (TẦNG HẠ TẦNG &amp; DỊCH VỤ NGOẠI VI)</text>
    <text x="820" y="24" fill="#f3e8ff" font-size="13" font-weight="500" text-anchor="end">Database Adapters &amp; External Services</text>
    
    <!-- Inner blocks -->
    <rect x="15" y="48" width="255" height="58" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" />
    <text x="142" y="72" fill="#7e22ce" font-size="13.5" font-weight="bold" text-anchor="middle">SQL Server Database</text>
    <text x="142" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">MS SQL Server 2014+ (mssql driver)</text>

    <rect x="285" y="48" width="265" height="58" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" />
    <text x="417" y="72" fill="#7e22ce" font-size="13.5" font-weight="bold" text-anchor="middle">External Notification Services</text>
    <text x="417" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">Nodemailer SMTP (Email), Socket.IO Server</text>

    <rect x="565" y="48" width="260" height="58" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" />
    <text x="695" y="72" fill="#7e22ce" font-size="13.5" font-weight="bold" text-anchor="middle">AI &amp; Payment Adapters</text>
    <text x="695" y="92" fill="#64748b" font-size="11.5" text-anchor="middle">Tesseract.js Engine, VNPAY / VietQR</text>
  </g>

  <!-- Footnote -->
  <text x="470" y="780" fill="#64748b" font-size="12" font-style="italic" text-anchor="middle">
    * Nguyên lý đảo ngược phụ thuộc (Dependency Inversion): Tầng ngoài triển khai các Interface được định nghĩa bởi Tầng trong.
  </text>
</svg>
