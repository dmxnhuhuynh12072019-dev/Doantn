    <text x="0" y="52" fill="#64748b">│   ├── </text>
    <text x="65" y="52" fill="#fcd34d" font-weight="bold">domain/</text>
    <text x="360" y="52" fill="#94a3b8" font-weight="bold"># 1. LỚP NGHIỆP VỤ CỐT LÕI (Không phụ thuộc Framework)</text>

    <text x="0" y="76" fill="#64748b">│   │   ├── </text>
    <text x="95" y="76" fill="#e2e8f0">entities/</text>
    <text x="360" y="76" fill="#64748b"># - Chứa các thực thể nguyên bản (Pure Classes)</text>

    <text x="0" y="100" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="100" fill="#cbd5e1">vehicle.entity.ts</text>

    <text x="0" y="124" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="124" fill="#cbd5e1">legal-document.entity.ts</text>

    <text x="0" y="148" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="148" fill="#cbd5e1">maintenance-schedule.entity.ts</text>

    <text x="0" y="172" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="172" fill="#cbd5e1">appointment.entity.ts</text>

    <text x="0" y="198" fill="#64748b">│   │   ├── </text>
    <text x="95" y="198" fill="#e2e8f0">repositories/</text>
    <text x="360" y="198" fill="#64748b"># - Định nghĩa Interface (Hợp đồng giao tiếp với DB)</text>

    <text x="0" y="222" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="222" fill="#cbd5e1">i-vehicle.repository.ts</text>

    <text x="0" y="246" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="246" fill="#cbd5e1">i-legal.repository.ts</text>

    <text x="0" y="270" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="270" fill="#cbd5e1">i-maintenance.repository.ts</text>

    <text x="0" y="296" fill="#64748b">│   │   └── </text>
    <text x="95" y="296" fill="#e2e8f0">exceptions/</text>
    <text x="360" y="296" fill="#64748b"># - Các ngoại lệ (Errors) đặc thù của nghiệp vụ</text>

    <text x="0" y="320" fill="#64748b">│   │       └── </text>
    <text x="125" y="320" fill="#cbd5e1">invalid-odometer.exception.ts</text>

    <text x="0" y="344" fill="#64748b">│   │</text>

