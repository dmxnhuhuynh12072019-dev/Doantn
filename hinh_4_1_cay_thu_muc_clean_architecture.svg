    <text x="0" y="370" fill="#64748b">│   ├── </text>
    <text x="65" y="370" fill="#4ade80" font-weight="bold">application/</text>
    <text x="360" y="370" fill="#94a3b8" font-weight="bold"># 2. LỚP ĐIỀU PHỐI ỨNG DỤNG (Use Cases &amp; Workflows)</text>

    <text x="0" y="394" fill="#64748b">│   │   ├── </text>
    <text x="95" y="394" fill="#e2e8f0">use-cases/</text>
    <text x="360" y="394" fill="#64748b"># - Xử lý logic nghiệp vụ theo từng chức năng (Use Case)</text>

