<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1620" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Consolas', 'Courier New', monospace;">
  <!-- Dark Background -->
  <rect x="0" y="0" width="1100" height="1620" fill="#0f172a" />
  
  <!-- Terminal Header / Border -->
  <rect x="15" y="15" width="1070" height="1590" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  
  <!-- Terminal Controls dots -->
  <circle cx="45" cy="42" r="6" fill="#ef4444" />
  <circle cx="65" cy="42" r="6" fill="#f59e0b" />
  <circle cx="85" cy="42" r="6" fill="#10b981" />
  <text x="550" y="47" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle">
    acoh-backend - Cấu trúc mã nguồn Clean Architecture
  </text>
  <line x1="15" y1="65" x2="1085" y2="65" stroke="#1e293b" stroke-width="1.5" />

  <!-- Code / Tree Content -->
  <g transform="translate(40, 95)" font-size="14" line-height="24">
    <!-- Line 1: Root -->
    <text x="0" y="0" fill="#38bdf8" font-weight="bold">acoh-backend/</text>

    <!-- Line 2: src -->
    <text x="0" y="24" fill="#64748b">├── </text>
    <text x="35" y="24" fill="#38bdf8" font-weight="bold">src/</text>

