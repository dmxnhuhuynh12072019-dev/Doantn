    <text x="125" y="806" fill="#cbd5e1">mssql-config.service.ts</text>
    <text x="360" y="806" fill="#64748b"># - Cấu hình kết nối SQL Server 2014+ (mssql driver)</text>

    <text x="0" y="830" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="830" fill="#e2e8f0">repositories/</text>
    <text x="360" y="830" fill="#64748b"># - Triển khai thực tế các Interface ở tầng Domain</text>

    <text x="0" y="854" fill="#64748b">│   │   │       ├── </text>
    <text x="155" y="854" fill="#cbd5e1">vehicle-impl.repository.ts</text>

    <text x="0" y="878" fill="#64748b">│   │   │       └── </text>
    <text x="155" y="878" fill="#cbd5e1">maintenance-impl.repository.ts</text>

    <text x="0" y="904" fill="#64748b">│   │   ├── </text>
    <text x="95" y="904" fill="#e2e8f0">cron/</text>
    <text x="360" y="904" fill="#64748b"># - Tác vụ quét ngầm tự động định kỳ hàng ngày lúc 00:00</text>

    <text x="0" y="928" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="928" fill="#cbd5e1">auto-scan.service.ts</text>

    <text x="0" y="952" fill="#64748b">│   │   ├── </text>
    <text x="95" y="952" fill="#e2e8f0">ocr/</text>
    <text x="360" y="952" fill="#64748b"># - Tích hợp AI Tesseract OCR nhận diện biển số xe</text>

    <text x="0" y="976" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="976" fill="#cbd5e1">tesseract-ocr.service.ts</text>

    <text x="0" y="1000" fill="#64748b">│   │   ├── </text>
    <text x="95" y="1000" fill="#e2e8f0">mailer/</text>
    <text x="360" y="1000" fill="#64748b"># - Dịch vụ gửi email thông báo tự động (Nodemailer SMTP)</text>

    <text x="0" y="1024" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="1024" fill="#cbd5e1">smtp-mailer.service.ts</text>

    <text x="0" y="1048" fill="#64748b">│   │   └── </text>
    <text x="95" y="1048" fill="#e2e8f0">payment/</text>
    <text x="360" y="1048" fill="#64748b"># - Tích hợp cổng thanh toán trực tuyến (VNPAY / VietQR)</text>

    <text x="0" y="1072" fill="#64748b">│   │       └── </text>
    <text x="125" y="1072" fill="#cbd5e1">vnpay-payment.service.ts</text>

    <text x="0" y="1096" fill="#64748b">│   │</text>

    <!-- ================= 4. PRESENTATION LAYER ================= -->
    <text x="0" y="1122" fill="#64748b">│   ├── </text>
    <text x="65" y="1122" fill="#38bdf8" font-weight="bold">presentation/</text>
    <text x="360" y="1122" fill="#94a3b8" font-weight="bold"># 4. LỚP GIAO TIẾP GIAO DIỆN (RESTful API &amp; WebSockets)</text>

    <text x="0" y="1146" fill="#64748b">│   │   ├── </text>
    <text x="95" y="1146" fill="#e2e8f0">controllers/</text>
    <text x="360" y="1146" fill="#64748b"># - Tiếp nhận HTTP Request từ Client (REST Controllers)</text>

    <text x="0" y="1170" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="1170" fill="#cbd5e1">vehicles.controller.ts</text>

    <text x="0" y="1194" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="1194" fill="#cbd5e1">legal.controller.ts</text>

    <text x="0" y="1218" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="1218" fill="#cbd5e1">maintenances.controller.ts</text>

    <text x="0" y="1242" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="1242" fill="#cbd5e1">appointments.controller.ts</text>

    <text x="0" y="1268" fill="#64748b">│   │   ├── </text>
    <text x="95" y="1268" fill="#e2e8f0">gateways/</text>
    <text x="360" y="1268" fill="#64748b"># - Kênh thông báo đẩy thời gian thực (Socket.IO Gateway)</text>

    <text x="0" y="1292" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="1292" fill="#cbd5e1">notification.gateway.ts</text>

    <text x="0" y="1316" fill="#64748b">│   │   ├── </text>
    <text x="95" y="1316" fill="#e2e8f0">guards/</text>
    <text x="360" y="1316" fill="#64748b"># - Phân quyền (RBAC Roles) và Xác thực (JWT Auth Guard)</text>

    <text x="0" y="1340" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="1340" fill="#cbd5e1">jwt-auth.guard.ts</text>

    <text x="0" y="1364" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="1364" fill="#cbd5e1">roles.guard.ts</text>

    <text x="0" y="1388" fill="#64748b">│   │   └── </text>
    <text x="95" y="1388" fill="#e2e8f0">interceptors/</text>
    <text x="360" y="1388" fill="#64748b"># - Định dạng format dữ liệu trả về (Response Formatting)</text>

    <text x="0" y="1412" fill="#64748b">│   │       └── </text>
    <text x="125" y="1412" fill="#cbd5e1">response.interceptor.ts</text>

    <!-- App Module & Main -->
    <text x="0" y="1438" fill="#64748b">│   ├── </text>
    <text x="65" y="1438" fill="#38bdf8" font-weight="bold">app.module.ts</text>
    <text x="360" y="1438" fill="#64748b"># Nơi khai báo và liên kết các module (Dependency Injection)</text>

    <text x="0" y="1464" fill="#64748b">│   └── </text>
    <text x="65" y="1464" fill="#38bdf8" font-weight="bold">main.ts</text>
    <text x="360" y="1464" fill="#64748b"># Điểm khởi chạy ứng dụng (Bootstrap, CORS, Port 3000)</text>

    <!-- Root Configs -->
    <text x="0" y="1496" fill="#64748b">├── </text>
    <text x="35" y="1496" fill="#e2e8f0">package.json</text>

    <text x="0" y="1522" fill="#64748b">└── </text>
    <text x="35" y="1522" fill="#e2e8f0">tsconfig.json</text>
  </g>
</svg>
