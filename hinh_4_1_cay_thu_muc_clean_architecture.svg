    <text x="125" y="418" fill="#a7f3d0">vehicle/</text>

    <text x="0" y="442" fill="#64748b">│   │   │   │   ├── </text>
    <text x="155" y="442" fill="#cbd5e1">create-vehicle.usecase.ts</text>

    <text x="0" y="466" fill="#64748b">│   │   │   │   └── </text>
    <text x="155" y="466" fill="#cbd5e1">update-odometer.usecase.ts</text>

    <text x="0" y="490" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="490" fill="#a7f3d0">legal/</text>

    <text x="0" y="514" fill="#64748b">│   │   │   │   └── </text>
    <text x="155" y="514" fill="#cbd5e1">check-expiry-alert.usecase.ts</text>

    <text x="0" y="538" fill="#64748b">│   │   │   ├── </text>
    <text x="125" y="538" fill="#a7f3d0">maintenance/</text>

    <text x="0" y="562" fill="#64748b">│   │   │   │   ├── </text>
    <text x="155" y="562" fill="#cbd5e1">complete-service-workflow.usecase.ts</text>

    <text x="0" y="586" fill="#64748b">│   │   │   │   └── </text>
    <text x="155" y="586" fill="#cbd5e1">generate-preset-schedule.usecase.ts</text>

    <text x="0" y="610" fill="#64748b">│   │   │   └── </text>
    <text x="125" y="610" fill="#a7f3d0">ocr/</text>

    <text x="0" y="634" fill="#64748b">│   │   │       └── </text>
    <text x="155" y="634" fill="#cbd5e1">scan-license-plate.usecase.ts</text>

    <text x="0" y="660" fill="#64748b">│   │   └── </text>
    <text x="95" y="660" fill="#e2e8f0">dtos/</text>
    <text x="360" y="660" fill="#64748b"># - Đối tượng truyền dữ liệu (Data Transfer Objects)</text>

    <text x="0" y="684" fill="#64748b">│   │       ├── </text>
    <text x="125" y="684" fill="#cbd5e1">create-vehicle.dto.ts</text>

    <text x="0" y="708" fill="#64748b">│   │       └── </text>
    <text x="125" y="708" fill="#cbd5e1">complete-appointment.dto.ts</text>

    <text x="0" y="732" fill="#64748b">│   │</text>

