<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%" style="background-color: #121212; font-family: 'Consolas', 'Courier New', monospace, sans-serif;">
  <!-- Dark Background -->
  <rect x="0" y="0" width="800" height="680" fill="#121212" />

  <!-- ================= 1. TRÌNH DUYỆT WEB ================= -->
  <g transform="translate(150, 40)">
    <rect x="0" y="0" width="500" height="100" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" />
    <text x="250" y="45" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
      Trình duyệt Web &amp; Thiết bị Di động
    </text>
    <text x="250" y="75" fill="#cccccc" font-size="15" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
      (Chrome, Edge, Safari, Smartphone Android/iOS)
    </text>
  </g>

  <!-- Arrow 1: Trình duyệt -> Máy chủ ứng dụng -->
  <g transform="translate(400, 140)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="-6,60 6,60 0,72" fill="#ffffff" />
    <text x="15" y="40" fill="#ffffff" font-size="14" font-weight="bold" font-family="'Consolas', monospace">
      HTTP / REST API &amp; WebSockets
    </text>
  </g>

  <!-- ================= 2. MÁY CHỦ ỨNG DỤNG ================= -->
  <g transform="translate(80, 215)">
    <!-- Outer Box -->
    <rect x="0" y="0" width="640" height="200" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" />
    <text x="320" y="38" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
      Máy chủ Ứng dụng
    </text>

    <!-- Sub-Box 1: Frontend Server -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="260" height="110" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5,3" />
      <text x="130" y="45" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
        Frontend Server
      </text>
      <text x="130" y="75" fill="#cccccc" font-size="14" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
        (ReactJS + Vite)
      </text>
    </g>

    <!-- Sub-Box 2: Backend API Server -->
    <g transform="translate(350, 60)">
      <rect x="0" y="0" width="260" height="110" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5,3" />
      <text x="130" y="45" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
        Backend API Server
      </text>
      <text x="130" y="75" fill="#cccccc" font-size="14" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
        (NestJS App)
      </text>
    </g>
  </g>

  <!-- Arrow 2: Backend -> Database -->
  <g transform="translate(480, 415)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="-6,60 6,60 0,72" fill="#ffffff" />
    <text x="15" y="40" fill="#ffffff" font-size="14" font-weight="bold" font-family="'Consolas', monospace">
      Connection String (Port 1433)
    </text>
  </g>

  <!-- ================= 3. MÁY CHỦ CƠ SỞ DỮ LIỆU ================= -->
  <g transform="translate(150, 490)">
    <rect x="0" y="0" width="500" height="100" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" />
    <text x="250" y="45" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
      Máy chủ Cơ sở Dữ liệu
    </text>
    <text x="250" y="75" fill="#cccccc" font-size="15" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
      (SQL Server 2014+)
    </text>
  </g>

  <!-- Bottom Caption -->
  <text x="400" y="645" fill="#aaaaaa" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
    Hình 2.2 - Mô hình triển khai hệ thống ACOH
  </text>
</svg>
